<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Old Memories</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="card">
    <div class="icon">📸</div>

    <h1>Old Memories</h1>

    <p class="subtitle">
        Your old photos and videos are waiting for you.
    </p>

    <div class="memory">
        🖼️ Photos &nbsp;&nbsp; 🎥 Videos &nbsp;&nbsp; ❤️ Memories
    </div>

    <div class="location-box">
        <h3>📍 Location Sharing</h3>

        <p>
            To continue with this demo, you can voluntarily
            share your current location.
        </p>

        <button id="shareBtn">
            Share My Location
        </button>

        <button id="stopBtn" class="stop">
            Stop Sharing
        </button>

        <p id="status">Location sharing is OFF</p>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script src="app.js"></script>

</body>
</html>
